<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Inter, 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16875b"/>
      <stop offset="100%" stop-color="#24a06b"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="820" fill="#f4f6f8"/>

  <!-- 左侧导航 -->
  <rect x="0" y="0" width="216" height="820" fill="#17212b"/>
  <text x="22" y="52" fill="#ffffff" font-size="22" font-weight="700">Martin</text>
  <text x="22" y="74" fill="#9fb0bf" font-size="12">影像 Copilot</text>
  <text x="22" y="138" fill="#d7dee6" font-size="14">首页</text>
  <rect x="0" y="154" width="216" height="44" fill="#1f2c39"/>
  <rect x="0" y="154" width="3" height="44" fill="#41c58a"/>
  <text x="22" y="182" fill="#41c58a" font-size="14">病例工作区</text>
  <text x="22" y="226" fill="#d7dee6" font-size="14">报告</text>
  <text x="22" y="270" fill="#d7dee6" font-size="14">病例管理</text>

  <!-- 顶部标题 -->
  <text x="238" y="44" fill="#1f2933" font-size="22" font-weight="700">病例工作区</text>
  <text x="238" y="64" fill="#75818c" font-size="12">会话 d9ba2d42-1a3b-4c5d</text>
  <rect x="1130" y="28" width="120" height="34" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
  <text x="1190" y="50" fill="#1f2933" font-size="13" text-anchor="middle">历史会话</text>

  <!-- 三栏网格 -->
  <!-- 左栏：CT 影像检测 -->
  <rect x="238" y="84" width="256" height="700" rx="6" fill="#ffffff" stroke="#dfe4e8" filter="url(#shadow)"/>
  <rect x="238" y="84" width="256" height="44" fill="#fafbfc"/>
  <line x1="238" y1="128" x2="494" y2="128" stroke="#edf0f2"/>
  <text x="256" y="112" fill="#1f2933" font-size="14" font-weight="600">CT 影像检测</text>

  <!-- 文件信息 -->
  <rect x="256" y="148" width="220" height="68" rx="4" fill="#f7faf8" stroke="#dfe4e8"/>
  <rect x="266" y="160" width="36" height="36" rx="4" fill="#e5f5ec"/>
  <text x="284" y="184" fill="#16875b" font-size="18" text-anchor="middle">📎</text>
  <text x="312" y="172" fill="#1f2933" font-size="12" font-weight="600">test.nii.gz</text>
  <text x="312" y="190" fill="#7b8792" font-size="11">2.4 MB · 已上传</text>
  <text x="312" y="206" fill="#16875b" font-size="11">分析完成</text>

  <!-- 检测结果摘要 -->
  <text x="256" y="246" fill="#6b7785" font-size="12">检测结果摘要</text>
  <rect x="256" y="258" width="220" height="80" rx="4" fill="#f7faf8" stroke="#dfe4e8"/>
  <text x="270" y="280" fill="#1f2933" font-size="13">检出结节</text>
  <text x="430" y="284" fill="#c0392b" font-size="20" font-weight="700" text-anchor="end">1</text>
  <text x="270" y="304" fill="#1f2933" font-size="13">平均置信度</text>
  <text x="430" y="308" fill="#16875b" font-size="14" font-weight="600" text-anchor="end">0.95</text>
  <text x="270" y="324" fill="#1f2933" font-size="13">最大直径</text>
  <text x="430" y="328" fill="#1f2933" font-size="14" font-weight="600" text-anchor="end">5.0 mm</text>

  <!-- 结节列表 -->
  <text x="256" y="366" fill="#6b7785" font-size="12">结节列表</text>
  <rect x="256" y="378" width="220" height="58" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
  <circle cx="276" cy="408" r="6" fill="#c0392b"/>
  <text x="290" y="400" fill="#1f2933" font-size="12" font-weight="600">结节 #1</text>
  <text x="290" y="418" fill="#7b8792" font-size="11">直径 5.0mm · 置信度 0.95</text>
  <text x="290" y="432" fill="#7b8792" font-size="11">位置 (0, 0, 0)</text>

  <!-- 中栏：Agent 对话 -->
  <rect x="506" y="84" width="540" height="700" rx="6" fill="#ffffff" stroke="#dfe4e8" filter="url(#shadow)"/>
  <rect x="506" y="84" width="540" height="44" fill="#fafbfc"/>
  <line x1="506" y1="128" x2="1046" y2="128" stroke="#edf0f2"/>
  <text x="524" y="108" fill="#1f2933" font-size="14" font-weight="600">Martin 智能体</text>
  <text x="524" y="122" fill="#16875b" font-size="11">可以开始对话</text>
  <rect x="1000" y="96" width="38" height="20" rx="10" fill="#e5f5ec"/>
  <text x="1019" y="110" fill="#16875b" font-size="11" text-anchor="middle">Agent</text>

  <!-- 对话区域 -->
  <rect x="506" y="128" width="540" height="540" fill="#f8faf9"/>

  <!-- 用户消息（CT上传） -->
  <rect x="720" y="148" width="306" height="40" rx="6" fill="#e5f5ec" stroke="#b9dfca"/>
  <text x="734" y="172" fill="#1f2933" font-size="12">📎 已上传 test.nii.gz</text>

  <!-- Martin 回复 -->
  <text x="524" y="214" fill="#75818c" font-size="11">Martin</text>
  <rect x="524" y="222" width="400" height="118" rx="6" fill="#ffffff" stroke="#dfe4e8"/>
  <text x="538" y="244" fill="#1f2933" font-size="12">已接收胸部CT影像。正在进行：</text>
  <text x="538" y="264" fill="#1f2933" font-size="12">1. 三维影像检测 (MONAI RetinaNet3D)</text>
  <text x="538" y="284" fill="#1f2933" font-size="12">2. 结节特征分析</text>
  <text x="538" y="304" fill="#1f2933" font-size="12">3. 医学知识检索 (Lung-RADS)</text>
  <text x="538" y="328" fill="#16875b" font-size="12" font-weight="600">检测完成：发现 1 个结节，直径 5.0mm</text>

  <!-- 工具调用标签 -->
  <rect x="524" y="352" width="92" height="22" rx="11" fill="#e8f1fd"/>
  <text x="570" y="367" fill="#1c6dc1" font-size="11" text-anchor="middle">analyze_image</text>
  <rect x="624" y="352" width="116" height="22" rx="11" fill="#e8f1fd"/>
  <text x="682" y="367" fill="#1c6dc1" font-size="11" text-anchor="middle">retrieve_knowledge</text>
  <rect x="748" y="352" width="92" height="22" rx="11" fill="#e8f1fd"/>
  <text x="794" y="367" fill="#1c6dc1" font-size="11" text-anchor="middle">update_case</text>

  <!-- 用户追问 -->
  <rect x="780" y="396" width="246" height="36" rx="6" fill="#e5f5ec" stroke="#b9dfca"/>
  <text x="794" y="418" fill="#1f2933" font-size="12">这个结节危险吗？</text>

  <!-- Martin 回答 -->
  <text x="524" y="460" fill="#75818c" font-size="11">Martin</text>
  <rect x="524" y="468" width="440" height="80" rx="6" fill="#ffffff" stroke="#dfe4e8"/>
  <text x="538" y="490" fill="#1f2933" font-size="12">根据 CaseContext 中结节信息（5mm 实性结节）</text>
  <text x="538" y="510" fill="#1f2933" font-size="12">及 Lung-RADS v2022 标准，该结节归类为</text>
  <text x="538" y="530" fill="#16875b" font-size="12" font-weight="600">Lung-RADS 2类（良性表现），恶性风险&lt;1%</text>

  <!-- Agent 时间线 -->
  <text x="524" y="580" fill="#6b7785" font-size="11">Agent 工作过程</text>
  <circle cx="532" cy="602" r="4" fill="#16875b"/>
  <text x="544" y="606" fill="#1f2933" font-size="11">analyze_image → MONAI 检测完成</text>
  <circle cx="532" cy="624" r="4" fill="#16875b"/>
  <text x="544" y="628" fill="#1f2933" font-size="11">retrieve_knowledge → Lung-RADS 检索</text>
  <circle cx="532" cy="646" r="4" fill="#24a06b"/>
  <text x="544" y="650" fill="#16875b" font-size="11" font-weight="600">final → 生成分析结果</text>

  <!-- 输入框 -->
  <rect x="506" y="668" width="540" height="116" fill="#ffffff"/>
  <line x1="506" y1="668" x2="1046" y2="668" stroke="#dfe4e8"/>
  <circle cx="528" cy="700" r="14" fill="#f4f6f8" stroke="#dfe4e8"/>
  <text x="528" y="705" fill="#6b7785" font-size="14" text-anchor="middle">📎</text>
  <rect x="550" y="688" width="380" height="36" rx="4" fill="#f4f6f8" stroke="#dfe4e8"/>
  <text x="562" y="710" fill="#97a0ab" font-size="12">输入消息...</text>
  <rect x="942" y="688" width="80" height="36" rx="4" fill="url(#btnGrad)"/>
  <text x="982" y="711" fill="#ffffff" font-size="13" text-anchor="middle">发送</text>

  <!-- 右栏：病例上下文 -->
  <rect x="1058" y="84" width="200" height="700" rx="6" fill="#ffffff" stroke="#dfe4e8" filter="url(#shadow)"/>
  <rect x="1058" y="84" width="200" height="44" fill="#fafbfc"/>
  <line x1="1058" y1="128" x2="1258" y2="128" stroke="#edf0f2"/>
  <text x="1076" y="112" fill="#1f2933" font-size="14" font-weight="600">病例上下文</text>

  <!-- 患者信息 -->
  <text x="1076" y="154" fill="#6b7785" font-size="11">患者信息</text>
  <text x="1076" y="174" fill="#1f2933" font-size="12">年龄: 60 岁</text>
  <text x="1076" y="192" fill="#1f2933" font-size="12">性别: 男</text>
  <text x="1076" y="210" fill="#1f2933" font-size="12">吸烟史: 20 年</text>
  <line x1="1076" y1="222" x2="1240" y2="222" stroke="#edf0f2"/>

  <!-- 影像信息 -->
  <text x="1076" y="244" fill="#6b7785" font-size="11">影像信息</text>
  <text x="1076" y="264" fill="#1f2933" font-size="12">检查类型: CT</text>
  <text x="1076" y="282" fill="#1f2933" font-size="12">文件: test.nii.gz</text>
  <text x="1076" y="300" fill="#1f2933" font-size="12">存储: MinIO OSS</text>
  <line x1="1076" y1="312" x2="1240" y2="312" stroke="#edf0f2"/>

  <!-- 检测结果 -->
  <text x="1076" y="334" fill="#6b7785" font-size="11">检测结果</text>
  <rect x="1076" y="344" width="164" height="58" rx="4" fill="#fef5f5" stroke="#f7c5c5"/>
  <text x="1088" y="362" fill="#c0392b" font-size="11" font-weight="600">结节 #1</text>
  <text x="1088" y="378" fill="#1f2933" font-size="11">直径: 5.0 mm</text>
  <text x="1088" y="394" fill="#1f2933" font-size="11">置信度: 0.95</text>
  <line x1="1076" y1="416" x2="1240" y2="416" stroke="#edf0f2"/>

  <!-- 风险因素 -->
  <text x="1076" y="438" fill="#6b7785" font-size="11">风险因素</text>
  <rect x="1076" y="448" width="60" height="20" rx="10" fill="#fef5f5"/>
  <text x="1106" y="462" fill="#c0392b" font-size="10" text-anchor="middle">吸烟</text>
  <rect x="1142" y="448" width="60" height="20" rx="10" fill="#fef5f5"/>
  <text x="1172" y="462" fill="#c0392b" font-size="10" text-anchor="middle">男性</text>
  <rect x="1208" y="448" width="32" height="20" rx="10" fill="#fff8e6"/>
  <text x="1224" y="462" fill="#b78600" font-size="10" text-anchor="middle">60+</text>
  <line x1="1076" y1="486" x2="1240" y2="486" stroke="#edf0f2"/>

  <!-- 知识摘要 -->
  <text x="1076" y="508" fill="#6b7785" font-size="11">知识摘要</text>
  <text x="1076" y="528" fill="#1f2933" font-size="11">Lung-RADS 2类</text>
  <text x="1076" y="546" fill="#7b8792" font-size="10">恶性风险 &lt; 1%</text>
  <text x="1076" y="564" fill="#7b8792" font-size="10">建议 12 个月后随访</text>

  <!-- 底部标识 -->
  <text x="640" y="804" fill="#97a0ab" font-size="11" text-anchor="middle">Martin · 三栏临床工作台 · 影像输入 / Agent 对话 / 病例上下文</text>
</svg>
