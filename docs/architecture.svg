<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="100%" role="img">
  <title>Martin 三库架构图</title>
  <desc>浏览器工作站经 FastAPI 网关进入 Agent 核心，Agent 读写三个 SQLite 库并按需调用外部服务与本地模型</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">

    <g fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5">
      <rect x="170" y="44" width="340" height="56" rx="10"/>
      <text x="340" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">浏览器 · Vue 3 工作站</text>
      <text x="340" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">登录 · 病例工作台 · 报告 · 知识库 · WebSocket</text>
    </g>

    <path d="M340 100 L340 144" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="352" y="126" font-size="12" fill="#5F5E5A">Cookie 会话 + REST / WebSocket</text>

    <g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
      <rect x="120" y="144" width="440" height="64" rx="10"/>
      <text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">FastAPI 网关</text>
      <text x="340" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">每请求核验：Cookie → 医生身份 → doctor_patient_access 授权</text>
      <text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">auth · patients · cases · threads · agent · image · sessions · knowledge · memory</text>
    </g>

    <path d="M340 208 L340 248" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="352" y="232" font-size="12" fill="#5F5E5A">授权后的请求（doctor_id 服务端注入）</text>

    <g>
      <rect x="40" y="248" width="600" height="172" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Agent 核心 — LangChain create_agent · ReAct 循环 · AgentExecutor</text>

      <g fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5">
        <rect x="47" y="286" width="110" height="44" rx="8"/>
        <rect x="166" y="286" width="110" height="44" rx="8"/>
        <rect x="285" y="286" width="110" height="44" rx="8"/>
        <rect x="404" y="286" width="110" height="44" rx="8"/>
        <rect x="523" y="286" width="110" height="44" rx="8"/>
      </g>
      <text x="102" y="301" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">影像分析</text>
      <text x="102" y="317" text-anchor="middle" font-size="11" fill="#0F6E56">MONAI</text>
      <text x="221" y="301" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">知识检索</text>
      <text x="221" y="317" text-anchor="middle" font-size="11" fill="#0F6E56">RAG · Chroma</text>
      <text x="340" y="301" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">报告生成</text>
      <text x="340" y="317" text-anchor="middle" font-size="11" fill="#0F6E56">LCEL 三档</text>
      <text x="459" y="301" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">病例上下文</text>
      <text x="459" y="317" text-anchor="middle" font-size="11" fill="#0F6E56">CaseContext</text>
      <text x="578" y="301" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">偏好保存</text>
      <text x="578" y="317" text-anchor="middle" font-size="11" fill="#0F6E56">doctor 命名空间</text>

      <g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
        <rect x="52" y="344" width="276" height="48" rx="8"/>
        <rect x="340" y="344" width="288" height="48" rx="8"/>
      </g>
      <text x="190" y="360" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">MemoryService 分区注入</text>
      <text x="190" y="377" text-anchor="middle" font-size="11" fill="#0F6E56">当前病例事实 / 患者历史记忆 → Prompt</text>
      <text x="484" y="360" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">enforce_preferences 输出硬校验</text>
      <text x="484" y="377" text-anchor="middle" font-size="11" fill="#0F6E56">全字符口径 · 数值/日期锚点保护</text>
    </g>

    <path d="M134 420 L134 470" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M340 420 L340 470" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M544 420 L544 470" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="60" y="448" font-size="12" fill="#5F5E5A">授权后读写</text>

    <g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
      <rect x="46" y="470" width="176" height="72" rx="10"/>
      <text x="134" y="490" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">app.sqlite · 事实源</text>
      <text x="134" y="507" text-anchor="middle" font-size="11" fill="#534AB7">10 张业务表：患者/病例/</text>
      <text x="134" y="523" text-anchor="middle" font-size="11" fill="#534AB7">findings / reports / audit</text>
    </g>
    <g fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5">
      <rect x="248" y="470" width="176" height="72" rx="10"/>
      <text x="336" y="490" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">sessions.sqlite</text>
      <text x="336" y="507" text-anchor="middle" font-size="11" fill="#854F0B">SqliteSaver checkpoints</text>
      <text x="336" y="523" text-anchor="middle" font-size="11" fill="#854F0B">thread_id = threads.id</text>
    </g>
    <g fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5">
      <rect x="450" y="470" width="176" height="72" rx="10"/>
      <text x="538" y="490" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">memory.sqlite</text>
      <text x="538" y="507" text-anchor="middle" font-size="11" fill="#3B6D11">SqliteStore：医生偏好 /</text>
      <text x="538" y="523" text-anchor="middle" font-size="11" fill="#3B6D11">observation:{finding_id}</text>
    </g>

    <path d="M630 420 L630 576" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="622" y="562" text-anchor="end" font-size="12" fill="#5F5E5A">工具按需调用</text>

    <g>
      <rect x="40" y="576" width="600" height="80" rx="14" fill="#F7F6F2" stroke="#888780" stroke-width="0.5"/>
      <text x="52" y="596" font-size="12" font-weight="500" fill="#444441">外部服务与本地模型</text>
      <g fill="#FFFFFF" stroke="#888780" stroke-width="0.5">
        <rect x="53" y="606" width="136" height="40" rx="8"/>
        <rect x="199" y="606" width="136" height="40" rx="8"/>
        <rect x="345" y="606" width="136" height="40" rx="8"/>
        <rect x="491" y="606" width="136" height="40" rx="8"/>
      </g>
      <text x="121" y="620" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">DeepSeek LLM</text>
      <text x="121" y="636" text-anchor="middle" font-size="11" fill="#5F5E5A">OpenAI 兼容端点</text>
      <text x="267" y="620" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">MinIO</text>
      <text x="267" y="636" text-anchor="middle" font-size="11" fill="#5F5E5A">CT 对象存储</text>
      <text x="413" y="620" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">MONAI 权重</text>
      <text x="413" y="636" text-anchor="middle" font-size="11" fill="#5F5E5A">3D 检测（本地）</text>
      <text x="559" y="620" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">BGE + ChromaDB</text>
      <text x="559" y="636" text-anchor="middle" font-size="11" fill="#5F5E5A">向量化与检索</text>
    </g>
  </g>
</svg>
