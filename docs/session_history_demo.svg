<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.4"/></filter>
  </defs>
  <!-- Terminal window -->
  <rect width="1100" height="780" rx="0" fill="#1a1a2e"/>
  <rect x="15" y="12" width="1070" height="756" rx="8" fill="#0d1117" stroke="#30363d" filter="url(#shadow)"/>
  <!-- Title bar -->
  <rect x="15" y="12" width="1070" height="32" rx="8" fill="#161b22"/>
  <rect x="15" y="32" width="1070" height="12" fill="#161b22"/>
  <circle cx="38" cy="28" r="6" fill="#ef4444"/>
  <circle cx="58" cy="28" r="6" fill="#f59e0b"/>
  <circle cx="78" cy="28" r="6" fill="#22c55e"/>
  <text x="535" y="33" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Martin Medical AI Agent — monai_learning</text>

  <!-- Content -->
  <g fill="#c9d1d9" font-family="Consolas, 'Cascadia Code', monospace" font-size="15">
    <!-- Welcome -->
    <text x="40" y="70" fill="#58a6ff">============================================================</text>
    <text x="40" y="93" fill="#7ee787">您好，我是 Martin 医学影像智能体。</text>
    <text x="40" y="116" fill="#c9d1d9">我可以协助分析肺部 CT、检索医学知识并生成结构化报告。</text>
    <text x="40" y="139" fill="#8b949e">当前会话 ID: d9ba2d42</text>
    <text x="40" y="162" fill="#8b949e">输入问题开始对话；可用命令:</text>
    <text x="40" y="185" fill="#58a6ff">list, open &lt;编号&gt;, switch &lt;编号&gt;, new, back, exit</text>
    <text x="40" y="208" fill="#58a6ff">============================================================</text>

    <!-- Prompt -->
    <text x="40" y="248" fill="#7ee787">&gt;&gt;&gt;</text>
    <text x="72" y="248" fill="#ffa657">list</text>

    <!-- Session list -->
    <text x="40" y="280" fill="#d2a8ff">=== History Sessions ===</text>
    <text x="40" y="308" fill="#58a6ff">1.</text>
    <text x="64" y="308" fill="#c9d1d9">8mm的结节是怎么样的</text>
    <text x="300" y="308" fill="#8b949e">[2026-07-14 04:57:20]</text>
    <text x="490" y="308" fill="#484f58">(d9ba2d42)</text>
    <text x="580" y="308" fill="#7ee787"> *</text>

    <text x="40" y="336" fill="#58a6ff">2.</text>
    <text x="64" y="336" fill="#c9d1d9">你现在再去知识库查询咱么最近对话提到的医学关键词</text>
    <text x="440" y="336" fill="#8b949e">[2026-07-14 04:44:09]</text>
    <text x="630" y="336" fill="#484f58">(15be086b)</text>

    <text x="40" y="364" fill="#58a6ff">3.</text>
    <text x="64" y="364" fill="#c9d1d9">E:\moani\medical_ai_agent\data\1.3.6.1.4.1.14519...</text>
    <text x="460" y="364" fill="#8b949e">[2026-07-14 03:54:19]</text>
    <text x="650" y="364" fill="#484f58">(570b99f5)</text>

    <text x="40" y="392" fill="#58a6ff">4.</text>
    <text x="64" y="392" fill="#c9d1d9">list</text>
    <text x="104" y="392" fill="#8b949e">[2026-07-14 03:34:16]</text>
    <text x="300" y="392" fill="#484f58">(bd848362)</text>

    <text x="40" y="420" fill="#58a6ff">5.</text>
    <text x="64" y="420" fill="#c9d1d9">你有什么功能吗</text>
    <text x="230" y="420" fill="#8b949e">[2026-07-14 03:09:09]</text>
    <text x="420" y="420" fill="#484f58">(default)</text>

    <!-- Divider -->
    <text x="40" y="470" fill="#30363d">────────────────────────────────────────────────────────</text>

    <!-- open 1 -->
    <text x="40" y="500" fill="#7ee787">&gt;&gt;&gt;</text>
    <text x="72" y="500" fill="#ffa657">open 1</text>

    <text x="40" y="530" fill="#d2a8ff">=== 8mm的结节是怎么样的 ===</text>
    <text x="40" y="555" fill="#ff7b72">User:</text>
    <text x="95" y="555" fill="#c9d1d9">8mm的结节是怎么样的</text>
    <text x="40" y="580" fill="#7ee787">Martin:</text>
    <text x="115" y="580" fill="#c9d1d9">好的！根据</text>
    <text x="212" y="580" fill="#ffa657">Lung-RADS v2022</text>
    <text x="365" y="580" fill="#c9d1d9">，8mm的肺结节需要根据结节类型...</text>

    <text x="40" y="605" fill="#8b949e">    ┌─────────────────────────────────────┐</text>
    <text x="40" y="628" fill="#8b949e">    │ 结节类型      │ Lung-RADS │ 恶性风险  │</text>
    <text x="40" y="649" fill="#8b949e">    │ 实性结节(8mm) │   4A ⚠️    │ 5%~15%  │</text>
    <text x="40" y="670" fill="#8b949e">    │ 部分实性      │   4A ⚠️    │ 5%~15%  │</text>
    <text x="40" y="691" fill="#8b949e">    │ 纯磨玻璃      │   2  ✅    │ &lt; 1%   │</text>
    <text x="40" y="712" fill="#8b949e">    └─────────────────────────────────────┘</text>

    <text x="40" y="740" fill="#58a6ff">============================================================</text>
    <text x="40" y="765" fill="#7ee787">&gt;&gt;&gt;</text>
    <text x="72" y="765" fill="#c9d1d9">_</text>
  </g>
</svg>
